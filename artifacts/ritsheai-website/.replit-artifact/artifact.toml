kind = "web"
previewPath = "/"
title = "RitsheAI Website"
description = "The official RitsheAI portfolio and technology laboratory for AI, software, developer tools, web experiences, and open-source work."
version = "1.0.0"
id = "artifacts/ritsheai-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26094

[services.development]
run = "pnpm --filter @workspace/ritsheai-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ritsheai-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/ritsheai-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26094"
BASE_PATH = "/"
